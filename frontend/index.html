<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Task Management</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="add-task-section">
            <form id="taskForm">
                <div class="form-row">
                    <input type="text" id="taskTitle" placeholder="Task title..." required>
                    <select id="taskPriority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <button type="submit" class="btn-primary">Add Task</button>
                </div>
                <textarea id="taskDescription" placeholder="Task description (optional)..." rows="2"></textarea>
            </form>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="todo">To Do</button>
            <button class="filter-btn" data-filter="in-progress">In Progress</button>
            <button class="filter-btn" data-filter="done">Done</button>
        </div>

        <div class="tasks-container">
            <div class="task-column">
                <h2 class="column-title">📝 To Do</h2>
                <div id="todoTasks" class="task-list"></div>
            </div>
            <div class="task-column">
                <h2 class="column-title">⚡ In Progress</h2>
                <div id="inProgressTasks" class="task-list"></div>
            </div>
            <div class="task-column">
                <h2 class="column-title">✅ Done</h2>
                <div id="doneTasks" class="task-list"></div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Task</h2>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                <input type="text" id="editTaskTitle" placeholder="Task title..." required>
                <textarea id="editTaskDescription" placeholder="Task description..." rows="3"></textarea>
                <select id="editTaskPriority">
                    <option value="low">Low Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <select id="editTaskStatus">
                    <option value="todo">To Do</option>
                    <option value="in-progress">In Progress</option>
                    <option value="done">Done</option>
                </select>
                <button type="submit" class="btn-primary">Update Task</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
